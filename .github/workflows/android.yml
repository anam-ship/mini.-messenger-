 
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Prepare SDK for Buildozer
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK path: $SDK"
          test -n "$SDK"
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/tools/bin"
          CMD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"
          test -n "$CMD_TOOLS"
          ln -sf "$CMD_TOOLS" "$SDK/tools/bin/sdkmanager"
          ln -sfn "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools" "$SDK/platform-tools"
          ln -sfn "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" "$SDK/build-tools"
          ln -sfn "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" "$SDK/platforms"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Messenger-APK
          path: bin/*.apk
          if-no-files-found: error


