
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Connect Android SDK to Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          REAL_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$REAL_SDK/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          test -n "$SDKMANAGER"
          test -x "$REAL_SDK/build-tools/34.0.0/aidl"

          mkdir -p "$REAL_SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$REAL_SDK/tools/bin/sdkmanager"

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$(dirname "$BUILD_SDK")"
          rm -rf "$BUILD_SDK"
          ln -s "$REAL_SDK" "$BUILD_SDK"

          echo "ANDROIDSDK=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"

          "$BUILD_SDK/tools/bin/sdkmanager" --version
          "$BUILD_SDK/build-tools/34.0.0/aidl" || test "$?" -eq 1

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Messenger-APK
          path: bin/*.apk
          if-no-files-found: error


